[project]
name = "machine-unlearning"
version = "0.1.0"
description = ""
authors = [
    {name = "ycalk (Лосев Алексей)",email = "alosev752@gmail.com"}
]
requires-python = ">=3.12,<3.14.1"
dependencies = [
    "torch (>=2.14.0,<3.0.0)",
    "kagglehub (>=1.0.2,<2.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "ipywidgets (>=8.1.9,<9.0.0)",
    "torchvision (>=0.29.0,<0.30.0)",
    "pydantic (>=2.13.5,<3.0.0)"
]

[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "pytorch-cpu"}
torchvision = {source = "pytorch-cpu"}

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)"
]
